<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Issue Details</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                        "surface-light": "#ffffff",
                        "surface-dark": "#182131",
                        "surface-hover": "#1f2937",
                    },
                    fontFamily: { "display": ["Inter", "sans-serif"] },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-gray-200">
    <div class="min-h-screen w-full flex flex-col items-center py-10 px-4">
        <div class="w-full max-w-2xl">
            <!-- Back Button -->
            <a href="maintenance_dashboard.html" class="inline-flex items-center text-sm text-gray-500 hover:text-primary mb-6 transition-colors">
                <span class="material-symbols-outlined text-lg mr-1">arrow_back</span>
                Back to Dashboard
            </a>

            <!-- Content Container -->
            <div id="detail-container" class="bg-surface-light dark:bg-surface-dark rounded-xl shadow-sm border border-gray-200 dark:border-gray-800 overflow-hidden">
                <div class="p-8 text-center text-gray-500">Loading details...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, auth } from "./firebase-options.js";
        import { doc, getDoc, updateDoc, Timestamp, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('detail-container');
            const params = new URLSearchParams(window.location.search);
            const issueId = params.get('id');

            if (!issueId) {
                container.innerHTML = '<div class="p-8 text-center text-red-500">No Issue ID provided.</div>';
                return;
            }

            try {
                const docRef = doc(db, "issues", issueId);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    container.innerHTML = '<div class="p-8 text-center text-red-500">Issue not found.</div>';
                    return;
                }

                const data = docSnap.data();
                const date = data.createdAt?.seconds ? new Date(data.createdAt.seconds * 1000).toLocaleDateString() : (data.date || 'N/A');
                const status = data.status || 'Open';

                // Render Details
                container.innerHTML = `
                    <div class="border-b border-gray-200 dark:border-gray-800 p-6 sm:p-8 flex justify-between items-start">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">${data.issueType || 'General'} Issue</h1>
                            <div class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400">
                                <span class="material-symbols-outlined text-lg">calendar_today</span>
                                Reported on ${date}
                            </div>
                        </div>
                        <span id="status-badge" class="px-3 py-1 rounded-full text-sm font-medium bg-primary/10 text-primary border border-primary/20">
                            ${status}
                        </span>
                    </div>
                    
                    <div class="p-6 sm:p-8 space-y-6">
                        <div>
                            <h3 class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Location</h3>
                            <p class="text-lg text-gray-900 dark:text-white flex items-center gap-2">
                                <span class="material-symbols-outlined text-gray-400">location_on</span>
                                ${data.location || 'Unknown'}
                            </p>
                        </div>

                        <div>
                            <h3 class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Description</h3>
                            <div class="bg-gray-50 dark:bg-gray-900/30 rounded-lg p-4 text-slate-800 dark:text-gray-200 leading-relaxed border border-gray-100 dark:border-gray-800">
                                ${data.description || 'No description provided.'}
                            </div>
                        </div>

                        <!-- Placeholder for image if available -->
                        <div class="pt-4 border-t border-gray-100 dark:border-gray-800">
                            ${data.imageUrl 
                                ? `<img src="${data.imageUrl}" alt="Issue Image" class="rounded-lg max-h-96 object-cover border border-gray-200 dark:border-gray-800">` 
                                : '<p class="text-sm text-gray-400 italic">No images attached to this report.</p>'
                            }
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div id="action-buttons-container" class="hidden border-t border-gray-200 dark:border-gray-800 p-6 sm:p-8 bg-gray-50 dark:bg-gray-900/30">
                        <h3 class="text-base font-bold text-gray-900 dark:text-white mb-4">Update Status</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <button id="btn-ack" class="flex items-center justify-center gap-2 px-4 py-2 bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300 rounded-lg font-medium hover:bg-blue-200 dark:hover:bg-blue-900/50 transition-colors">
                                <span class="material-symbols-outlined">visibility</span> Acknowledge
                            </button>
                            <button id="btn-contact" class="flex items-center justify-center gap-2 px-4 py-2 bg-purple-100 text-purple-700 dark:bg-purple-900/30 dark:text-purple-300 rounded-lg font-medium hover:bg-purple-200 dark:hover:bg-purple-900/50 transition-colors">
                                <span class="material-symbols-outlined">contact_phone</span> Contact Team
                            </button>
                            <button id="btn-dispatch" class="flex items-center justify-center gap-2 px-4 py-2 bg-yellow-100 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-300 rounded-lg font-medium hover:bg-yellow-200 dark:hover:bg-yellow-900/50 transition-colors">
                                <span class="material-symbols-outlined">local_shipping</span> Dispatch
                            </button>
                            <button id="btn-resolve" class="flex items-center justify-center gap-2 px-4 py-2 bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-300 rounded-lg font-medium hover:bg-green-200 dark:hover:bg-green-900/50 transition-colors">
                                <span class="material-symbols-outlined">check_circle</span> Resolve
                            </button>
                        </div>
                    </div>

                    <!-- Comments Section -->
                    <div class="border-t border-gray-200 dark:border-gray-800 p-6 sm:p-8 bg-white dark:bg-surface-dark">
                        <h3 class="text-base font-bold text-gray-900 dark:text-white mb-4">Updates & Comments</h3>
                        <div class="flex flex-col gap-4 mb-6" id="comments-list">
                            <p class="text-sm text-gray-500 italic">Loading updates...</p>
                        </div>
                        <div class="flex gap-3 items-start">
                            <textarea id="comment-input" class="w-full rounded-lg border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white text-sm focus:ring-primary focus:border-primary" rows="3" placeholder="Send a message to the reporter..."></textarea>
                            <button id="btn-send-comment" class="px-4 py-2 bg-primary text-white rounded-lg font-medium text-sm whitespace-nowrap hover:bg-primary/90 transition-colors">Send</button>
                        </div>
                    </div>
                `;

                // Check Authentication and Role for Action Buttons
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        const userDocRef = doc(db, "users", user.uid);
                        const userDocSnap = await getDoc(userDocRef);
                        if (userDocSnap.exists()) {
                            const userData = userDocSnap.data();
                            if (userData.role === 'maintenance') {
                                document.getElementById('action-buttons-container').classList.remove('hidden');
                            }
                        }
                    }
                });

                // Status Update Logic
                const updateStatus = async (newStatus) => {
                    try {
                        await updateDoc(docRef, {
                            status: newStatus,
                            updatedAt: Timestamp.now()
                        });
                        const badge = document.getElementById('status-badge');
                        if (badge) badge.textContent = newStatus;
                    } catch (e) {
                        console.error("Error updating status:", e);
                        alert("Failed to update status");
                    }
                };

                document.getElementById('btn-ack').onclick = () => updateStatus('Acknowledged');
                document.getElementById('btn-contact').onclick = () => updateStatus('Team Contacted');
                document.getElementById('btn-dispatch').onclick = () => updateStatus('Dispatched');
                document.getElementById('btn-resolve').onclick = () => updateStatus('Resolved');

                // Comments Logic
                const commentsRef = collection(db, "issues", issueId, "comments");
                const q = query(commentsRef, orderBy("createdAt", "asc"));

                onSnapshot(q, (snapshot) => {
                    const commentsList = document.getElementById('comments-list');
                    if (snapshot.empty) {
                        commentsList.innerHTML = '<p class="text-sm text-gray-500 italic">No updates yet.</p>';
                    } else {
                        let html = '';
                        snapshot.forEach(doc => {
                            const c = doc.data();
                            const date = c.createdAt ? new Date(c.createdAt.seconds * 1000).toLocaleString() : '';
                            html += `
                                <div class="flex gap-3">
                                    <div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center text-primary font-bold text-xs shrink-0">
                                        ${c.authorName ? c.authorName[0].toUpperCase() : 'U'}
                                    </div>
                                    <div class="flex-1">
                                        <div class="bg-gray-50 dark:bg-gray-800/50 rounded-lg p-3 border border-gray-100 dark:border-gray-700">
                                            <div class="flex justify-between items-center mb-1">
                                                <span class="font-semibold text-sm text-gray-900 dark:text-white">${c.authorName || 'User'}</span>
                                                <span class="text-xs text-gray-500">${date}</span>
                                            </div>
                                            <p class="text-sm text-gray-600 dark:text-gray-300">${c.text}</p>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        commentsList.innerHTML = html;
                        commentsList.scrollTop = commentsList.scrollHeight;
                    }
                });

                document.getElementById('btn-send-comment').onclick = async () => {
                    const input = document.getElementById('comment-input');
                    const text = input.value.trim();
                    if (!text) return;

                    const user = auth.currentUser;
                    if (!user) {
                        alert("You must be logged in to comment.");
                        return;
                    }

                    try {
                        const userDocRef = doc(db, "users", user.uid);
                        const userDocSnap = await getDoc(userDocRef);
                        const userData = userDocSnap.exists() ? userDocSnap.data() : {};

                        const commentData = {
                            text: text,
                            authorId: user.uid,
                            authorName: userData.fullName || user.displayName || user.email,
                            createdAt: Timestamp.now()
                        };

                        if (userData.role === 'maintenance') {
                            commentData.departmentId = userData.department || 'Maintenance';
                        }

                        await addDoc(commentsRef, commentData);
                        input.value = '';
                    } catch (e) {
                        console.error("Error sending comment:", e);
                        alert("Failed to send message.");
                    }
                };

            } catch (error) {
                container.innerHTML = `<div class="p-8 text-center text-red-500">Error: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
